<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Maria Perezolova</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lakki+Reddy&family=Love+Ya+Like+A+Sister&family=Life+Savers:wght@400;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #24365F;
            font-family: 'Lakki Reddy', cursive;
            overflow-x: hidden;
        }

        .portfolio-container {
            position: relative;
            width: 100%;
            max-width: 1920px;
            margin: 0 auto;
            background: #24365F;
            min-height: 100vh;
        }

        .logo {
            position: absolute;
            left: 470px;
            top: 44px;
            font-family: 'Love Ya Like A Sister', cursive;
            font-size: 96px;
            color: #FFFA67;
            z-index: 20;
        }

        /* Навигация */
        .nav-home, .nav-portfolio, .nav-about, .nav-contacts {
            position: absolute;
            width: 220px;
            height: 70px;
            top: 268px;
            background: #616FD0;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }
        .nav-home { left: 431px; background: #616FD0; }
        .nav-portfolio { left: 671px; background: #24318E; }
        .nav-about { left: 911px; background: #616FD0; }
        .nav-contacts { left: 1151px; background: #616FD0; }
        
        .nav-home:hover, .nav-portfolio:hover, .nav-about:hover, .nav-contacts:hover {
            transform: scale(1.02);
            background: #7a88e8;
        }
        
        .nav-home a, .nav-portfolio a, .nav-about a, .nav-contacts a {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lakki Reddy', cursive;
            font-size: 36px;
            color: #FFFA67;
            text-decoration: none;
        }

        /* Карточки */
        .card-1, .card-2, .card-3, .card-4 {
            position: absolute;
            width: 452.48px;
            height: 302.36px;
            border-radius: 90px;
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lakki Reddy', cursive;
            font-size: 48px;
            background-size: cover;
            background-position: center;
        }
        .card-1 { left: 497px; top: 355.94px; background: #3a4b7a; color: #FFFA67; text-shadow: 0 4px 4px #FFFA67; }
        .card-2 { left: 965.83px; top: 353px; background: #4a5b8a; color: #FFFA67; }
        .card-3 { left: 498.93px; top: 675.92px; background: #5a6b9a; color: #28007E; text-shadow: 0 4px 4px #488CCB; }
        .card-4 { left: 967.76px; top: 672.98px; background: #6a7baa; color: #28007E; }
        
        .card-1:hover, .card-2:hover, .card-3:hover, .card-4:hover { transform: scale(1.02); }
        
        .card-1::before { content: "Theathre"; }
        .card-2::before { content: "Stage collections"; font-size: 38px; text-align: center; }
        .card-3::before { content: "Graphics"; }
        .card-4::before { content: "Accessories"; }

        /* Нижняя секция */
        .footer-text-left {
            position: absolute;
            left: 600px;
            top: 1065px;
            font-family: 'Life Savers', serif;
            font-weight: 800;
            font-size: 20px;
            color: #616FD0;
            z-index: 20;
        }
        .footer-text-right {
            position: absolute;
            left: 1000px;
            top: 1065px;
            font-family: 'Life Savers', serif;
            font-weight: 800;
            font-size: 20px;
            color: #616FD0;
            z-index: 20;
        }

        /* Адаптивность */
        @media (max-width: 1400px) {
            .logo { position: relative; left: auto; text-align: center; padding-top: 20px; font-size: 60px; }
            .nav-home, .nav-portfolio, .nav-about, .nav-contacts { position: relative; left: auto; top: auto; margin: 10px auto; width: 180px; height: 55px; }
            .nav-home a, .nav-portfolio a, .nav-about a, .nav-contacts a { font-size: 28px; }
            .card-1, .card-2, .card-3, .card-4 { position: relative; left: auto; top: auto; margin: 20px auto; width: 90%; max-width: 400px; height: 250px; }
            .card-1::before, .card-2::before, .card-3::before, .card-4::before { font-size: 32px; text-align: center; }
            .footer-text-left, .footer-text-right { position: relative; left: auto; top: auto; margin: 20px; text-align: center; }
            .portfolio-container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        }

        @media (max-width: 768px) {
            .logo { font-size: 48px; }
            .nav-home, .nav-portfolio, .nav-about, .nav-contacts { width: 140px; height: 45px; }
            .nav-home a, .nav-portfolio a, .nav-about a, .nav-contacts a { font-size: 22px; }
            .footer-text-left, .footer-text-right { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="portfolio-container">
    <div class="logo">LOGO</div>

    <div class="nav-home"><a href="#">Home</a></div>
    <div class="nav-portfolio"><a href="#">Portfolio</a></div>
    <div class="nav-about"><a href="#">About me</a></div>
    <div class="nav-contacts"><a href="#">Contacts</a></div>

    <div class="card-1" onclick="alert('Theathre — скоро подробнее')"></div>
    <div class="card-2" onclick="alert('Stage collections — скоро подробнее')"></div>
    <div class="card-3" onclick="alert('Graphics — скоро подробнее')"></div>
    <div class="card-4" onclick="alert('Accessories — скоро подробнее')"></div>

    <div class="footer-text-left">
        Types of work:<br>
        Fashion illustration<br>
        Digital graphic<br>
        Suit tailoring
    </div>
    <div class="footer-text-right">
        Use programs:<br>
        CorelDraw<br>
        Krita<br>
        ClipStudio<br>
        Clo3D
    </div>
</div>
</body>
</html>
